<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anant's Typing Rush</title>
<style>
  :root { --bg:#101827; --card:#1b2940; --text:#f4f7fb; --muted:#aab8cc; --accent:#55e6a5; --bad:#ff6b7a; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; font-family:system-ui,Arial,sans-serif; background:radial-gradient(circle at top,#263d60,var(--bg) 60%); color:var(--text); display:flex; justify-content:center; padding:18px 12px; }
  .app { width:min(680px,100%); }
  header { text-align:center; margin:8px 0 20px; }
  h1 { margin:0; font-size:clamp(1.8rem,7vw,2.6rem); letter-spacing:.5px; }
  h1 span { color:var(--accent); }
  .subtitle { color:var(--muted); margin-top:7px; }
  .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:14px; }
  .stat,.panel { background:rgba(27,41,64,.95); border:1px solid #344762; border-radius:16px; padding:14px; }
  .stat { text-align:center; }
  .label { color:var(--muted); font-size:.82rem; }
  .value { font-size:1.55rem; font-weight:800; margin-top:3px; }
  .panel { padding:18px; }
  .topline { display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; }
  select,button,input { font:inherit; border-radius:11px; }
  select { background:#101827; color:var(--text); border:1px solid #526783; padding:9px; }
  .progress { height:8px; background:#0e1726; border-radius:20px; overflow:hidden; margin:16px 0; }
  .bar { height:100%; width:100%; background:var(--accent); transition:width .25s linear; }
  #words { min-height:130px; line-height:2; font-size:1.35rem; letter-spacing:.3px; overflow-wrap:anywhere; margin:14px 0 18px; }
  .word { display:inline-block; margin:0 7px 0 0; padding:0 2px; border-radius:4px; color:#91a3bb; }
  .word.current { background:#354963; color:white; outline:1px solid #6c829f; }
  .word.done { color:var(--accent); }
  .word.wrong { color:var(--bad); text-decoration:underline; }
  input { width:100%; padding:15px; background:#0f1929; color:white; border:2px solid #526783; outline:none; }
  input:focus { border-color:var(--accent); }
  .buttons { display:flex; gap:10px; margin-top:12px; }
  button { border:0; padding:12px 16px; font-weight:800; cursor:pointer; }
  .primary { background:var(--accent); color:#10251d; flex:1; }
  .secondary { background:#344762; color:white; }
  .message { min-height:28px; color:var(--muted); text-align:center; margin-top:14px; }
  .result { display:none; text-align:center; margin-top:15px; }
  .result h2 { color:var(--accent); }
  footer { text-align:center; color:var(--muted); font-size:.82rem; margin:16px 0 6px; }
  @media(max-width:420px){ .stat {padding:10px 4px}.value{font-size:1.3rem} #words{font-size:1.18rem} .panel{padding:13px} }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>⌨️ Typing <span>Rush</span></h1>
    <div class="subtitle">A mini typing game made for you, bro!</div>
  </header>
  <div class="stats">
    <div class="stat"><div class="label">TIME</div><div class="value" id="time">30</div></div>
    <div class="stat"><div class="label">WPM</div><div class="value" id="wpm">0</div></div>
    <div class="stat"><div class="label">ACCURACY</div><div class="value" id="accuracy">100%</div></div>
  </div>
  <section class="panel">
    <div class="topline">
      <strong>Choose your challenge</strong>
      <select id="duration" aria-label="Game duration">
        <option value="30">30 seconds</option>
        <option value="60">60 seconds</option>
        <option value="15">15 seconds</option>
      </select>
    </div>
    <div class="progress"><div class="bar" id="bar"></div></div>
    <div id="words" aria-label="Words to type"></div>
    <input id="typing" placeholder="Tap here, then type the words…" autocomplete="off" autocapitalize="off" spellcheck="false" disabled>
    <div class="buttons">
      <button class="primary" id="start">▶ Start game</button>
      <button class="secondary" id="reset">↻ Restart</button>
    </div>
    <div class="message" id="message">Press Start and type each word followed by a space.</div>
    <div class="result" id="result">
      <h2>🏁 Game over, bro!</h2>
      <p id="summary"></p>
      <button class="primary" id="playAgain">Play again</button>
    </div>
  </section>
  <footer>Tip: accuracy first, speed comes with practice. Works on mobile and computer.</footer>
</div>
<script>
const bank = ("game quick brown fox jumps over the lazy dog learn practice school science planet bright strong happy friend typing keyboard speed focus brave dream build create world player village block craft explore amazing clever little tiger mango river mountain computer mobile challenge victory power smile never give up keep moving study books pencil window garden music rocket travel future family answer question simple healthy energy rhythm heart muscle plant tissue").split(" ");
const wordsEl = document.getElementById("words"), input = document.getElementById("typing");
const timeEl = document.getElementById("time"), wpmEl = document.getElementById("wpm"), accEl = document.getElementById("accuracy");
const bar = document.getElementById("bar"), message = document.getElementById("message"), result = document.getElementById("result");
let words=[], index=0, seconds=30, total=30, timer=null, running=false, startedAt=0, correctChars=0, typedChars=0, correctWords=0;

function makeWords(n=55) {
  words = [];
  for(let i=0;i<n;i++) words.push(bank[Math.floor(Math.random()*bank.length)]);
  renderWords();
}
function renderWords(){
  wordsEl.innerHTML = words.map((w,i)=>`<span class="word ${i<index?'done':''} ${i===index?'current':''}" id="word${i}">${w}</span>`).join("");
  const current=document.getElementById("word"+index);
  if(current) current.scrollIntoView({block:"nearest",behavior:"smooth"});
}
function updateStats(){
  const elapsed=Math.max(1,(Date.now()-startedAt)/1000);
  wpmEl.textContent = running || startedAt ? Math.round(correctWords/(elapsed/60)) : 0;
  accEl.textContent=(typedChars?Math.round(correctChars/typedChars*100):100)+"%";
}
function startGame(){
  clearInterval(timer); total=Number(document.getElementById("duration").value); seconds=total;
  index=0; correctChars=0; typedChars=0; correctWords=0; running=true; startedAt=Date.now();
  timeEl.textContent=seconds; wpmEl.textContent="0"; accEl.textContent="100%"; bar.style.width="100%";
  result.style.display="none"; input.disabled=false; input.value=""; input.focus();
  message.textContent="Go, bro! Type the highlighted word, then press space.";
  makeWords(); document.getElementById("start").textContent="▶ Restart game";
  timer=setInterval(()=>{seconds--;timeEl.textContent=seconds;bar.style.width=(seconds/total*100)+"%";updateStats();if(seconds<=0) endGame();},1000);
}
function endGame(){
  clearInterval(timer); running=false; input.disabled=true; updateStats();
  result.style.display="block";
  document.getElementById("summary").textContent=`You typed ${correctWords} correct words at ${wpmEl.textContent} WPM with ${accEl.textContent} accuracy. Keep practising!`;
  message.textContent="Nice try! Every round helps you improve.";
}
input.addEventListener("input",()=>{
  if(!running)return;
  const value=input.value;
  if(value.endsWith(" ")){
    const typed=value.trim(), target=words[index]||"";
    typedChars+=typed.length+1;
    if(typed===target){correctChars+=target.length+1;correctWords++; const el=document.getElementById("word"+index);if(el)el.classList.add("done");}
    else { const el=document.getElementById("word"+index);if(el)el.classList.add("wrong"); }
    index++;
    if(index>=words.length){makeWords();index=0;}
    renderWords(); input.value=""; updateStats();
  } else {
    const el=document.getElementById("word"+index);
    if(el) { el.classList.toggle("wrong", value.length>0 && !words[index].startsWith(value)); }
  }
});
document.getElementById("start").addEventListener("click",startGame);
document.getElementById("reset").addEventListener("click",startGame);
document.getElementById("playAgain").addEventListener("click",startGame);
makeWords();
</script>
</body>
</html>
